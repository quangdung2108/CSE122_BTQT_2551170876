
<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6 kỳ quan thiên nhiên Việt Nam</title>
    <link rel="stylesheet" href="/css/stylebai14.css">
</head>

<body>
    <h1>6 kỳ quan thiên nhiên Việt Nam</h1>
    <p class="tieudephu">
        Việt Nam sở hữu nhiều kỳ quan thiên nhiên được thế giới công nhận
        — từ vịnh biển, hang động đến núi cao và miền sông nước.
    </p>
    <div class="noidung">

        <figure>
            <img src="/imgs/1-vinh-ha-long.jpg" alt="Vịnh Hạ Long">
            <figcaption>
                <h3>Vịnh Hạ Long</h3>
                <p>Gần 2.000 đảo đá vôi, Di sản thiên nhiên thế giới, thuộc Quảng Ninh.</p>
            </figcaption>
        </figure>

        <figure>
            <img src="/imgs/2-son-doong.jpg" alt="Hang Sơn Đoòng">
            <figcaption>
                <h3>Hang Sơn Đoòng</h3>
                <p>Hang động tự nhiên lớn nhất thế giới, thuộc Quảng Bình.</p>
            </figcaption>
        </figure>

        <figure>
            <img src="/imgs/3-thac-ban-gioc.jpg" alt="Thác Bản Giốc">
            <figcaption>
                <h3>Thác Bản Giốc</h3>
                <p>Thác nước đẹp nhất Việt Nam, nằm ở Cao Bằng.</p>
            </figcaption>
        </figure>

        <figure>
            <img src="/imgs/4-fansipan.jpg" alt="Fansipan">
            <figcaption>
                <h3>Fansipan</h3>
                <p>"Mái nhà Đông Dương", cao 3.147 m, thuộc Lào Cai.</p>
            </figcaption>
        </figure>

        <figure>
            <img src="/imgs/5-mekong.jpg" alt="Đồng bằng sông Cửu Long">
            <figcaption>
                <h3>Đồng bằng sông Cửu Long</h3>
                <p>Vựa lúa, miệt vườn sông nước trù phú miền Nam.</p>
            </figcaption>
        </figure>

        <figure>
            <img src="/imgs/6-phong-nha.jpg" alt="Động Phong Nha">
            <figcaption>
                <h3>Động Phong Nha</h3>
                <p>Hệ thống hang động kỳ vĩ, Di sản thiên nhiên thế giới.</p>
            </figcaption>
        </figure>
    </div>
</body>
</html>
