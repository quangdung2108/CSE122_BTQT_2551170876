<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="stylebai10.css">
</head>
<body>
    <div class="form">
        <div class="tieude">
            <h2>Liên hệ với chúng tôi</h2>
            <p>Vui lòng điền thông tin bên dưới, chúng tôi sẽ phản hồi trong 24 giờ.</p>
        </div>
        <form>
            <div class="hang">
                <div>
                    <label>Họ và tên</label>
                    <input type="text" value="Nguyễn Văn An">
                </div>

                <div>
                    <label>Email</label>
                    <input type="email" value="an.nv@tlu.edu.vn">
                </div>
            </div>
            <div class="hang">
                <div>
                    <label>Số điện thoại</label>
                    <input type="text" value="0987 654 321">
                </div>

                <div>
                    <label>Chủ đề</label>
                    <select>
                        <option>Hỏi về khoá học</option>
                        <option>Hỏi về học phí</option>
                        <option>Khác</option>
                    </select>
                </div>
            </div>
            <label>Nội dung</label>
            <textarea rows="4">Em muốn hỏi về lịch nộp bài tập môn Lập trình Web ạ.</textarea>
            <div class="dongcheck">
                <input type="checkbox" checked>
                <span>Tôi đồng ý nhận email<br>phản hồi.</span>
            </div>
            <button type="submit">Gửi liên hệ</button>
            <button type="reset" class="nhaplai">Nhập lại</button>
        </form>
    </div>
</body>

</html>
