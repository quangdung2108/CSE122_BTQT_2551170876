
<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 15 - Máy tính</title>
    <link rel="stylesheet" href="/css/stylebai15.css">
</head>

<body>

    <div class="may-tinh">

        <!-- Màn hình máy tính -->
        <div class="man-hinh">
            <div id="phepTinh">12 + 8 × 3</div>
            <div id="ketQua">36</div>
        </div>

        <!-- Bàn phím máy tính -->
        <div class="ban-phim">

            <!-- Hàng 1 -->
            <button class="nut-c" data-value="C">C</button>
            <button class="nut-xanh" data-value="()">( )</button>
            <button class="nut-xanh" data-value="%">%</button>
            <button class="nut-xanh" data-value="÷">÷</button>

            <!-- Hàng 2 -->
            <button data-value="7">7</button>
            <button data-value="8">8</button>
            <button data-value="9">9</button>
            <button class="nut-xanh" data-value="×">×</button>

            <!-- Hàng 3 -->
            <button data-value="4">4</button>
            <button data-value="5">5</button>
            <button data-value="6">6</button>
            <button class="nut-xanh" data-value="−">−</button>

            <!-- Hàng 4 -->
            <button data-value="1">1</button>
            <button data-value="2">2</button>
            <button data-value="3">3</button>
            <button class="nut-xanh" data-value="+">+</button>

            <!-- Hàng 5 -->
            <button class="so-khong" data-value="0">0</button>
            <button data-value=".">.</button>
            <button class="nut-bang" data-value="=">=</button>

        </div>

    </div>

    <script src="/java/scriptbai15.js"></script>

</body>
</html>
