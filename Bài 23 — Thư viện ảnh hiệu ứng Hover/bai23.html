
<!DOCTYPE html>
<html lang="vi">

<head>

    <title>Bài 23 - Thư viện ảnh</title>

</head>

<body>

    <div class="container">

        </header>

        <div class="thu-vien">

            <div class="anh">
                <img src="1-vinh-ha-long.jpg" alt="Vịnh Hạ Long">

            </div>

            <div class="anh">
                <img src="2-son-doong.jpg" alt="Hang Sơn Đoòng">

            </div>

            <div class="anh">
                <img src="3-thac-ban-gioc.jpg" alt="Thác Bản Giốc">

            </div>

            <div class="anh">
                <img src="4-fansipan.jpg" alt="Fansipan">
                <div class="lop-phu">Fansipan</div>
            </div>

            <div class="anh">
                <img src="5-mekong.jpg" alt="Đồng bằng sông Cửu Long">
                <div class="lop-phu">Đồng bằng sông Cửu Long</div>
            </div>

            <div class="anh">
                <img src="6-phong-nha.jpg" alt="Động Phong Nha">
