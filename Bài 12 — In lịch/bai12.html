<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 12 - Lịch ngày tháng năm</title>
    <link rel="stylesheet" href="stylebai12.css">
</head>
<body>
    <div class="khung-lich">
        <div class="o-lich">
            <div id="hienThiNam">2026</div>
            <div id="hienThiThang">Tháng 12</div>
            <div id="hienThiNgay">24</div>
            <div id="hienThiThu">Thứ năm</div>
        </div>
        <div class="loi-chao" id="loiChao">
            Chào buổi sáng!
        </div>
        <div class="form-nhap">
            <div class="nhom-nhap">
                <label for="ngay">Ngày</label>
                <input type="number" id="ngay" value="24">
            </div>
            <div class="nhom-nhap">
                <label for="thang">Tháng</label>
                <input type="number" id="thang" value="12">
            </div>

            <div class="nhom-nhap">
                <label for="nam">Năm</label>
                <input type="number" id="nam" value="2026">
            </div>

            <button type="button" id="btnInLich">
                In<br>lịch
            </button>
        </div>
    </div>
    <script src="scriptbai12.js"></script>
</body>
</html>
