
<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 26 - Đăng ký CLB Lập trình Web</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="stylebai26.css">
</head>

<body>

    <div class="container my-5">

        <div class="card shadow">

            <div class="card-header bg-success text-white text-center py-3">
                <h2 class="mb-0">Đăng ký tham gia CLB Lập trình Web</h2>
            </div>

            <div class="card-body p-4">

                <form action="#" method="get">

                    <div class="row g-3">

                        <div class="col-md-6">
                            <label for="hoTen" class="form-label">
                                Họ và tên
                            </label>
                            <input type="text"
                                   class="form-control"
                                   id="hoTen"
                                   name="hoTen"
                                   placeholder="Nguyễn Văn A"
                                   required>
                        </div>

                        <div class="col-md-6">
                            <label for="maSV" class="form-label">
                                Mã sinh viên
                            </label>
                            <input type="text"
                                   class="form-control"
                                   id="maSV"
                                   name="maSV"
                                   placeholder="22xxxxxx"
                                   required>
                        </div>

                        <div class="col-md-6">
                            <label for="email" class="form-label">
                                Email
                            </label>
                            <input type="email"
                                   class="form-control"
                                   id="email"
                                   name="email"
                                   placeholder="sv@tlu.edu.vn"
                                   required>
                        </div>

                        <div class="col-md-6">
                            <label for="sdt" class="form-label">
                                Số điện thoại
                            </label>
                            <input type="tel"
                                   class="form-control"
                                   id="sdt"
                                   name="sdt"
                                   placeholder="09xxxxxxxx"
                                   pattern="[0-9]{10}"
                                   title="Nhập số điện thoại gồm 10 chữ số"
                                   required>
                        </div>

                        <div class="col-12">
                            <label class="form-label">
                                Trình độ
                            </label>

                            <div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input"
                                           type="radio"
                                           name="trinhDo"
                                           id="coBan"
                                           value="Cơ bản"
                                           checked>
                                    <label class="form-check-label" for="coBan">
                                        Cơ bản
                                    </label>
                                </div>

                                <div class="form-check form-check-inline">
                                    <input class="form-check-input"
                                           type="radio"
                                           name="trinhDo"
                                           id="kha"
                                           value="Khá">
                                    <label class="form-check-label" for="kha">
                                        Khá
                                    </label>
                                </div>

                                <div class="form-check form-check-inline">
                                    <input class="form-check-input"
                                           type="radio"
                                           name="trinhDo"
                                           id="tot"
                                           value="Tốt">
                                    <label class="form-check-label" for="tot">
                                        Tốt
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div class="col-12">
                            <label for="lop" class="form-label">
                                Chọn lớp
                            </label>

                            <select class="form-select" id="lop" name="lop" required>
                                <option value="67CNTT1">67CNTT1</option>
                                <option value="67CNTT2">67CNTT2</option>
                                <option value="67CNTT3">67CNTT3</option>
                                <option value="67CNTT4">67CNTT4</option>
                            </select>
                        </div>

                        <div class="col-12">
                            <div class="form-check">
                                <input class="form-check-input"
                                       type="checkbox"
                                       id="camKet"
                                       name="camKet"
                                       required>

                                <label class="form-check-label" for="camKet">
                                    Tôi cam kết tự làm bài và quay video OBS
                                </label>
                            </div>
                        </div>

                        <div class="col-12">
                            <div class="d-flex justify-content-end gap-2 mt-3">

                                <button type="reset"
                                        class="btn btn-outline-secondary">
                                    Nhập lại
                                </button>

                                <button type="submit"
                                        class="btn btn-success">
                                    Đăng ký
                                </button>

                            </div>
                        </div>

                    </div>

                </form>

            </div>

        </div>

    </div>

</body>
</html>
