
<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 30 - Bảng điều khiển Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="stylebai30.css">
</head>

<body>

    <div class="dashboard d-flex">

        <nav class="sidebar">
            <h5>CSE.TLU Admin</h5>

            <a href="#" class="active">Bảng điều khiển</a>
            <a href="#">Bài tập</a>
            <a href="#">Sinh viên</a>
            <a href="#">Điểm số</a>
        </nav>

        <main class="noi-dung flex-grow-1 p-4">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="m-0">Bảng điều khiển</h4>

                <div>
                    <span class="badge bg-warning text-dark">5 bài mới</span>
                    <button class="btn btn-primary btn-sm">
                        Xuất báo cáo
                    </button>
                </div>
            </div>

            <div class="row g-3 mb-4">

                <div class="col-md-3 col-sm-6">
                    <div class="card shadow-sm border-0">
                        <div class="card-body">
                            <p>Sinh viên</p>
                            <h3>128</h3>

                            <div class="progress">
                                <div class="progress-bar bg-primary"
                                     style="width: 75%"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-md-3 col-sm-6">
                    <div class="card shadow-sm border-0">
                        <div class="card-body">
                            <p>Đã nộp</p>
                            <h3>96</h3>

                            <div class="progress">
                                <div class="progress-bar bg-success"
                                     style="width: 75%"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-md-3 col-sm-6">
                    <div class="card shadow-sm border-0">
                        <div class="card-body">
                            <p>Chưa nộp</p>
                            <h3>32</h3>

                            <div class="progress">
                                <div class="progress-bar bg-danger"
                                     style="width: 25%"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-md-3 col-sm-6">
                    <div class="card shadow-sm border-0">
                        <div class="card-body">
                            <p>Điểm TB</p>
                            <h3>7.8</h3>

                            <div class="progress">
                                <div class="progress-bar bg-warning"
                                     style="width: 78%"></div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

            <div class="card shadow-sm border-0">

                <div class="card-header bg-white fw-bold">
                    Tiến độ theo chương
                </div>

                <ul class="list-group list-group-flush">

                    <li class="list-group-item d-flex justify-content-between">
                        Chương 1 — HTML5
                        <span class="badge bg-success">100%</span>
                    </li>

                    <li class="list-group-item d-flex justify-content-between">
                        Chương 2 — JavaScript
                        <span class="badge bg-info text-dark">82%</span>
                    </li>

                    <li class="list-group-item d-flex justify-content-between">
                        Chương 3 — CSS3
                        <span class="badge bg-info text-dark">74%</span>
                    </li>

                    <li class="list-group-item d-flex justify-content-between">
                        Chương 4 — Bootstrap 5
                        <span class="badge bg-secondary">45%</span>
                    </li>

                </ul>

            </div>

        </main>

    </div>

</body>
</html>
