<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Thơ Bốn Mùa</title>
    <link rel="stylesheet" href="stylebai1.css">
</head>

<body>
    <main>
        <div class="khungbai">
            <div class="tieude">
                <h2>BỐN MÙA</h2>
            </div>
            <div class="kho1">
                <p>
                    Xuân về hoa nở khắp trời<br>
                    Hạ sang nắng cháy rạng ngời phố quen<br>
                    Thu về lá rụng bên thềm
                </p>
            </div>
            <hr>
            <div class="kho2">
                <p>
                    Đông sang gió lạnh bên em đợi chờ<br>
                    Bốn mùa lá bốn giấc mơ<br>
                    Thời gian đi mãi ta chờ đợi chi
                </p>
            </div>
            <hr>
            <div class="kho3">
                <p>
                    Một năm rồi lại một năm<br>
                    Vẫn còn câu hát thì thầm quê hương<br>
                    Chờ xuân nắng mới soi đường
                </p>
            </div>
        </div>
    </main>
</body>

</html>
